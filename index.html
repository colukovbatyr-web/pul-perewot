<!DOCTYPE html>
<html lang="tk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0b0f17">
<title>Pul Perewot</title>

<!-- Supabase CDN -->
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
:root{
  --bg:#0b0f17;
  --card:#141a24;
  --card-border:rgba(255,255,255,0.08);
  --text:#ffffff;
  --muted:#828e9e;
  --accent:#25d366;
  --accent-glow:rgba(37,211,102,0.2);
  --blue:#0075eb;
  --font:-apple-system, BlinkMacSystemFont, "SF Pro Display", sans-serif;
}

*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;}
body{
  background:var(--bg);
  color:var(--text);
  font-family:var(--font);
  min-height:100vh;
  display:flex;
  justify-content:center;
  padding:calc(16px + env(safe-area-inset-top)) 16px calc(40px + env(safe-area-inset-bottom));
}

.container{
  width:100%;
  max-width:440px;
  display:flex;
  flex-direction:column;
  gap:14px;
}

/* Üst Kısım */
.header{
  display:flex;
  align-items:center;
  justify-content:space-between;
  padding:4px 0;
}
.brand{
  display:flex;
  align-items:center;
  gap:10px;
}
.brand-logo{
  width:40px;
  height:40px;
  border-radius:12px;
  background:linear-gradient(135deg, #25d366, #128c7e);
  display:grid;
  place-items:center;
  font-weight:900;
  font-size:20px;
  color:#06140b;
}
.brand-title{font-size:18px;font-weight:800;letter-spacing:-0.4px;}
.brand-sub{font-size:11px;color:var(--muted);font-weight:600;}

.refresh-btn{
  width:38px;
  height:38px;
  border-radius:12px;
  background:var(--card);
  border:1px solid var(--card-border);
  color:#fff;
  font-size:16px;
  display:grid;
  place-items:center;
  cursor:pointer;
}
.refresh-btn:active{transform:scale(0.92);}

/* Canlı Kur Göstergesi */
.live-rate-bar{
  background:var(--card);
  border:1px solid var(--card-border);
  border-radius:16px;
  padding:12px 16px;
  display:flex;
  align-items:center;
  justify-content:space-between;
  font-size:12px;
}
.live-rate-bar span{color:var(--muted);font-weight:600;}
.live-rate-bar strong{color:var(--accent);font-size:15px;font-weight:800;}

/* Döviz Seçim Kartları */
.currency-tabs{
  display:grid;
  grid-template-columns:repeat(3, 1fr);
  gap:8px;
}
.cur-tab{
  background:var(--card);
  border:1px solid var(--card-border);
  border-radius:14px;
  padding:12px 6px;
  text-align:center;
  cursor:pointer;
  transition:all 0.2s ease;
}
.cur-tab.active{
  background:rgba(37,211,102,0.12);
  border-color:var(--accent);
}
.cur-tab-code{font-size:15px;font-weight:800;}
.cur-tab-rate{font-size:11px;color:var(--muted);margin-top:2px;font-weight:600;}
.cur-tab.active .cur-tab-rate{color:var(--accent);}

/* Ana Dönüştürücü Kartı */
.calc-card{
  background:var(--card);
  border:1px solid var(--card-border);
  border-radius:20px;
  padding:18px;
  display:flex;
  flex-direction:column;
  gap:12px;
}

.input-box{display:flex;flex-direction:column;gap:6px;}
.input-label{font-size:11px;color:var(--muted);font-weight:700;text-transform:uppercase;}
.input-row{display:flex;align-items:center;justify-content:space-between;gap:8px;}

.amount-input{
  width:100%;
  border:0;
  background:transparent;
  color:#fff;
  font-size:34px;
  font-weight:800;
  outline:0;
}
.amount-input::placeholder{color:rgba(255,255,255,0.2);}
.curr-badge{
  background:rgba(255,255,255,0.06);
  border:1px solid var(--card-border);
  border-radius:10px;
  padding:6px 12px;
  font-size:13px;
  font-weight:800;
}

.swap-row{
  display:flex;
  align-items:center;
  justify-content:center;
  position:relative;
  margin:4px 0;
}
.swap-btn{
  width:38px;
  height:38px;
  border-radius:50%;
  background:#1e2634;
  border:1px solid var(--card-border);
  color:#fff;
  font-size:16px;
  display:grid;
  place-items:center;
  cursor:pointer;
}
.swap-btn:active{transform:rotate(180deg) scale(0.9);}

/* Hızlı Tutar Çipleri */
.chips-row{
  display:flex;
  gap:6px;
  margin-top:4px;
}
.chip{
  flex:1;
  background:rgba(255,255,255,0.04);
  border:1px solid var(--card-border);
  border-radius:10px;
  padding:7px 0;
  text-align:center;
  font-size:11px;
  font-weight:750;
  color:var(--muted);
  cursor:pointer;
}
.chip:active{background:rgba(255,255,255,0.12);color:#fff;}

/* Sonuç Kartı */
.result-card{
  background:linear-gradient(145deg, #102519, #0d1a12);
  border:1px solid rgba(37,211,102,0.3);
  border-radius:20px;
  padding:18px;
  display:flex;
  flex-direction:column;
  gap:4px;
}
.result-label{font-size:11px;color:rgba(255,255,255,0.6);font-weight:700;}
.result-value-row{display:flex;align-items:baseline;justify-content:space-between;}
.result-amount{font-size:36px;font-weight:900;color:#fff;}
.result-curr{font-size:14px;color:rgba(255,255,255,0.6);font-weight:800;}

/* Doğrudan Ekran Üzerinde Profil Kartı (Açılır pencere yok) */
.profile-box{
  background:var(--card);
  border:1px solid var(--card-border);
  border-radius:20px;
  padding:16px;
  display:flex;
  flex-direction:column;
  gap:10px;
}
.profile-header{
  display:flex;
  align-items:center;
  justify-content:space-between;
}
.profile-title{font-size:13px;font-weight:800;}
.profile-status{font-size:11px;color:var(--accent);font-weight:700;}

.profile-inputs{display:grid;grid-template-columns:1fr 1fr;gap:8px;}
.p-inp{
  width:100%;
  height:44px;
  background:rgba(255,255,255,0.04);
  border:1px solid var(--card-border);
  border-radius:12px;
  padding:0 12px;
  color:#fff;
  font-size:13px;
  outline:0;
}
.p-inp::placeholder{color:var(--muted);}
.save-prof-btn{
  height:44px;
  border-radius:12px;
  background:rgba(255,255,255,0.08);
  border:1px solid var(--card-border);
  color:#fff;
  font-size:12px;
  font-weight:750;
  cursor:pointer;
}
.save-prof-btn:active{background:rgba(255,255,255,0.14);}

/* WhatsApp Butonu */
.whatsapp-btn{
  width:100%;
  height:54px;
  border-radius:18px;
  background:var(--accent);
  color:#06140b;
  border:0;
  font-size:15px;
  font-weight:850;
  display:flex;
  align-items:center;
  justify-content:center;
  gap:8px;
  cursor:pointer;
  box-shadow:0 8px 24px var(--accent-glow);
}
.whatsapp-btn:active{transform:scale(0.97);}

/* Bildirim Kutusu (Toast) */
.toast-msg{
  position:fixed;
  top:calc(16px + env(safe-area-inset-top));
  left:50%;
  transform:translate(-50%, -20px);
  background:#fff;
  color:#000;
  padding:8px 16px;
  border-radius:12px;
  font-size:11px;
  font-weight:800;
  box-shadow:0 8px 20px rgba(0,0,0,0.4);
  opacity:0;
  pointer-events:none;
  transition:all 0.25s ease;
  z-index:999;
}
.toast-msg.show{opacity:1;transform:translate(-50%,0);}
</style>
</head>
<body>

<div class="container">
  <!-- Üst Bar -->
  <div class="header">
    <div class="brand">
      <div class="brand-logo">P</div>
      <div>
        <div class="brand-title">Pul Perewot</div>
        <div class="brand-sub" id="headerSub">Çalt • Ýönekeý • Ynamly</div>
      </div>
    </div>
    <div class="refresh-btn" id="btnRefresh">↻</div>
  </div>

  <!-- Canlı Baza Kuru Şeridi -->
  <div class="live-rate-bar">
    <span>Garantirlenen Kurs:</span>
    <strong id="liveRateDisplay">1 USD = 89.01 RUB</strong>
  </div>

  <!-- Döviz Kartları -->
  <div class="currency-tabs">
    <div class="cur-tab active" data-cur="USD">
      <div class="cur-tab-code">USD ($)</div>
      <div class="cur-tab-rate" id="tabUsdRate">86.56 ₽</div>
    </div>
    <div class="cur-tab" data-cur="EUR">
      <div class="cur-tab-code">EUR (€)</div>
      <div class="cur-tab-rate" id="tabEurRate">94.20 ₽</div>
    </div>
    <div class="cur-tab" data-cur="TRY">
      <div class="cur-tab-code">TRY (₺)</div>
      <div class="cur-tab-rate" id="tabTryRate">2.65 ₽</div>
    </div>
  </div>

  <!-- Hesaplayıcı -->
  <div class="calc-card">
    <div class="input-box">
      <div class="input-label" id="lblInputDirection">GÖNDERILÝÄN MÖÇBER</div>
      <div class="input-row">
        <input type="text" inputmode="decimal" class="amount-input" id="inpAmount" placeholder="0" autocomplete="off">
        <div class="curr-badge" id="badgeInputCurr">USD</div>
      </div>
    </div>

    <!-- Hızlı Çipler -->
    <div class="chips-row">
      <div class="chip" data-add="100">+100</div>
      <div class="chip" data-add="500">+500</div>
      <div class="chip" data-add="1000">+1,000</div>
      <div class="chip" id="chipClear">Arassala</div>
    </div>

    <div class="swap-row">
      <div class="swap-btn" id="btnSwap">⇅</div>
    </div>

    <!-- Sonuç Kutusu -->
    <div class="result-card">
      <div class="result-label" id="lblOutputDirection">ALYJYNYŇ ALJAK TÖLEGI</div>
      <div class="result-value-row">
        <div class="result-amount" id="resultDisplay">0</div>
        <div class="result-curr" id="badgeOutputCurr">RUB</div>
      </div>
    </div>
  </div>

  <!-- Sayfa Üzerinde Doğrudan Profil (Şifresiz ve Ekranı Kapatmayan Alan) -->
  <div class="profile-box">
    <div class="profile-header">
      <div class="profile-title">Müşderi Maglumaty</div>
      <div class="profile-status" id="profSavedBadge">✓ Saklanan</div>
    </div>
    <div class="profile-inputs">
      <input type="text" class="p-inp" id="profName" placeholder="Adyňyz (Meselem: Batyr)">
      <input type="text" class="p-inp" id="profPhone" placeholder="Tel (+7 903 015...)">
    </div>
    <button class="save-prof-btn" id="btnSaveProf">Maglumatlary Ýatda Sakla</button>
  </div>

  <!-- WhatsApp Butonu -->
  <button class="whatsapp-btn" id="btnWhatsApp">
    <span>WhatsApp Bilen Ugrat</span>
    <span>→</span>
  </button>
</div>

<div class="toast-msg" id="toast"></div>

<script>
// --- SUPABASE BULUT BAĞLANTISI ---
const SUPABASE_URL = 'https://ovajjfouqyqfpzestuph.supabase.co';
const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im92YWpqZm91cXlxZnB6ZXN0dXBoIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTA1NDYyNjgsImV4cCI6MjEwNjEyMjI2OH0.WnL0Q6UK5Et1gPIo-FSEMZm7RIXJ7XC5BlxpYPwB89g';

let supabaseClient = null;
try {
  if (window.supabase && typeof window.supabase.createClient === 'function') {
    supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
  }
} catch (e) {
  console.log("Supabase ýerli rejimde dowam edýär.");
}

// --- STATE ---
const API_URL = 'https://open.er-api.com/v6/latest/USD';
const PHONE_WHATSAPP = '79030156403';
let activeCur = 'USD';
let direction = 'toRUB'; // toRUB veya fromRUB
let commMultiplier = parseFloat(localStorage.getItem('pulCommissionMultiplier')) || 1.04;
let rates = { USD: 86.56, EUR: 94.20, TRY: 2.65 };

function showToast(msg){
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  clearTimeout(showToast.timer);
  showToast.timer = setTimeout(() => t.classList.remove('show'), 2000);
}

// --- HESAPLAMA MOTORU ---
const inpAmount = document.getElementById('inpAmount');
const resultDisplay = document.getElementById('resultDisplay');

function calculate(){
  const raw = inpAmount.value.replace(/\s/g, '').replace(',', '.');
  const amount = parseFloat(raw) || 0;
  const baseRate = rates[activeCur] || 1;
  const finalRate = baseRate * commMultiplier;
  let target = 0;

  if(direction === 'toRUB'){
    target = amount * finalRate;
    document.getElementById('liveRateDisplay').textContent = `1 ${activeCur} = ${finalRate.toFixed(2)} RUB`;
    document.getElementById('lblInputDirection').textContent = 'GÖNDERILÝÄN MÖÇBER';
    document.getElementById('lblOutputDirection').textContent = 'ALYJYNYŇ ALJAK TÖLEGI';
    document.getElementById('badgeInputCurr').textContent = activeCur;
    document.getElementById('badgeOutputCurr').textContent = 'RUB';
    resultDisplay.textContent = amount > 0 ? new Intl.NumberFormat('ru-RU', {maximumFractionDigits:0}).format(Math.round(target)) : '0';
  } else {
    target = amount > 0 ? (amount / finalRate) : 0;
    document.getElementById('liveRateDisplay').textContent = `1 RUB = ${(1/finalRate).toFixed(4)} ${activeCur}`;
    document.getElementById('lblInputDirection').textContent = 'GÖNDERILÝÄN (RUB)';
    document.getElementById('lblOutputDirection').textContent = `ALYJYNYŇ ALŞY (${activeCur})`;
    document.getElementById('badgeInputCurr').textContent = 'RUB';
    document.getElementById('badgeOutputCurr').textContent = activeCur;
    resultDisplay.textContent = amount > 0 ? new Intl.NumberFormat('ru-RU', {maximumFractionDigits:2}).format(target) : '0';
  }

  return { amount, finalRate, target };
}

inpAmount.addEventListener('input', calculate);

// --- DÖVİZ TIKLAMA ---
document.querySelectorAll('.cur-tab').forEach(tab => {
  tab.addEventListener('click', () => {
    document.querySelectorAll('.cur-tab').forEach(t => t.classList.remove('active'));
    tab.classList.add('active');
    activeCur = tab.dataset.cur;
    calculate();
  });
});

// --- SWAP (ÇEVİRME) ---
document.getElementById('btnSwap').addEventListener('click', () => {
  direction = direction === 'toRUB' ? 'fromRUB' : 'toRUB';
  calculate();
  showToast(direction === 'toRUB' ? `${activeCur} → RUB` : `RUB → ${activeCur}`);
});

// --- HIZLI TUTAR ÇİPLERİ ---
document.querySelectorAll('.chip[data-add]').forEach(btn => {
  btn.addEventListener('click', () => {
    const add = parseFloat(btn.dataset.add);
    const curr = parseFloat(inpAmount.value) || 0;
    inpAmount.value = curr + add;
    calculate();
  });
});

document.getElementById('chipClear').addEventListener('click', () => {
  inpAmount.value = '';
  calculate();
});

// --- KURLARI ÇEKME ---
async function fetchRates(){
  try{
    const res = await fetch(API_URL, {cache:'no-store'});
    const data = await res.json();
    if(data?.rates?.RUB){
      rates.USD = Number(data.rates.RUB);
      if(data.rates.EUR) rates.EUR = Number(data.rates.RUB) / Number(data.rates.EUR);
      if(data.rates.TRY) rates.TRY = Number(data.rates.RUB) / Number(data.rates.TRY);

      document.getElementById('tabUsdRate').textContent = `${rates.USD.toFixed(2)} ₽`;
      document.getElementById('tabEurRate').textContent = `${rates.EUR.toFixed(2)} ₽`;
      document.getElementById('tabTryRate').textContent = `${rates.TRY.toFixed(2)} ₽`;

      calculate();
    }
  }catch(e){}
}

document.getElementById('btnRefresh').addEventListener('click', () => {
  fetchRates();
  showToast('Nyrhlar täzelendi ✓');
});

// --- PROFİL YATDA SAKLAMA (YEREL VE SUPABASE) ---
function loadProfile(){
  const savedName = localStorage.getItem('pul_userName') || '';
  const savedPhone = localStorage.getItem('pul_userPhone') || '';
  document.getElementById('profName').value = savedName;
  document.getElementById('profPhone').value = savedPhone;
  if(savedName){
    document.getElementById('headerSub').textContent = `Salam, ${savedName}!`;
    document.getElementById('profSavedBadge').textContent = '✓ Bellenen';
  } else {
    document.getElementById('profSavedBadge').textContent = '—';
  }
}

document.getElementById('btnSaveProf').addEventListener('click', async () => {
  const name = document.getElementById('profName').value.trim();
  const phone = document.getElementById('profPhone').value.trim();
  localStorage.setItem('pul_userName', name);
  localStorage.setItem('pul_userPhone', phone);
  
  if(name) document.getElementById('headerSub').textContent = `Salam, ${name}!`;
  document.getElementById('profSavedBadge').textContent = '✓ Saklandy';
  showToast('Maglumatlar ýatda saklandy ✓');

  // Supabase Kayıt Denemesi
  if(supabaseClient && (name || phone)){
    try {
      await supabaseClient.from('profiles').upsert([{ full_name: name, phone: phone }]);
    } catch(err){}
  }
});

// --- WHATSAPP AKIŞI ---
document.getElementById('btnWhatsApp').addEventListener('click', async () => {
  const res = calculate();
  if(res.amount <= 0){
    showToast('Möçberi giriziň!');
    inpAmount.focus();
    return;
  }

  const name = document.getElementById('profName').value.trim() || localStorage.getItem('pul_userName') || 'Bellenmedik';
  const phone = document.getElementById('profPhone').value.trim() || localStorage.getItem('pul_userPhone') || '—';

  const fromCurr = direction === 'toRUB' ? activeCur : 'RUB';
  const toCurr = direction === 'toRUB' ? 'RUB' : activeCur;
  const sentFormatted = `${res.amount} ${fromCurr}`;
  const getFormatted = direction === 'toRUB' ? `${Math.round(res.target)} RUB` : `${res.target.toFixed(2)} ${activeCur}`;

  const msg = `PUL PEREWOT\n\n` +
              `👤 Müşderi: ${name}\n` +
              `📱 Telefon: ${phone}\n` +
              `📅 Sene: ${new Date().toLocaleString('tk-TM')}\n\n` +
              `Gönderilýän:\n${sentFormatted}\n\n` +
              `Baza Kursy:\n1 ${activeCur} = ${res.finalRate.toFixed(2)} RUB\n\n` +
              `Alyjynyň aljak möçberi:\n${getFormatted}`;

  // Supabase Transfer Kaydı
  if(supabaseClient){
    try {
      await supabaseClient.from('transfers').insert([{
        from_currency: fromCurr,
        to_currency: toCurr,
        amount: res.amount,
        total: res.target,
        rate: res.finalRate
      }]);
    } catch(e){}
  }

  window.location.href = `https://wa.me/${PHONE_WHATSAPP}?text=` + encodeURIComponent(msg);
});

// Başlangıç
(function init(){
  loadProfile();
  fetchRates();
})();
</script>
</body>
</html>
