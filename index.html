<!DOCTYPE html>
<html lang="tk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

<title>Pul Perewot — V12</title>

<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.4/dist/chart.umd.min.js"></script>

<style>
*{
  box-sizing:border-box;
  -webkit-tap-highlight-color:transparent;
}

:root{
  --bg:#030712;
  --bg2:#071225;
  --card:rgba(8,20,40,.82);
  --card2:rgba(10,29,55,.72);
  --blue:#1683ff;
  --blue2:#38bdf8;
  --cyan:#22d3ee;
  --text:#f4f9ff;
  --muted:#8295ad;
  --line:rgba(120,180,255,.13);
  --shadow:0 22px 65px rgba(0,0,0,.48);
}

html,body{
  margin:0;
  min-height:100%;
  background:
    radial-gradient(circle at 15% 0%,rgba(22,131,255,.20),transparent 32%),
    radial-gradient(circle at 100% 30%,rgba(34,211,238,.12),transparent 30%),
    #030712;
  color:var(--text);
  font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","Segoe UI",sans-serif;
}

body{
  overflow-x:hidden;
}

body:before{
  content:"";
  position:fixed;
  inset:0;
  pointer-events:none;
  background:
    linear-gradient(
      120deg,
      transparent 0%,
      rgba(56,189,248,.025) 45%,
      transparent 55%
    );
  animation:ambient 8s ease-in-out infinite;
}

@keyframes ambient{
  0%,100%{transform:translateX(-8%);opacity:.4}
  50%{transform:translateX(8%);opacity:1}
}

.app{
  width:100%;
  max-width:430px;
  min-height:100vh;
  margin:auto;
  padding:18px 15px 35px;
  position:relative;
}

.header{
  display:flex;
  justify-content:space-between;
  align-items:center;
  margin-bottom:22px;
}

.logo-wrap{
  display:flex;
  align-items:center;
  gap:11px;
}

.logo{
  width:46px;
  height:46px;
  display:flex;
  align-items:center;
  justify-content:center;
  border-radius:15px;
  color:white;
  font-weight:900;
  background:
    linear-gradient(135deg,#60a5fa,#1683ff,#06b6d4);
  box-shadow:
    0 0 25px rgba(22,131,255,.38),
    inset 0 1px rgba(255,255,255,.4);
  cursor:pointer;
  animation:logoPulse 3s infinite;
}

@keyframes logoPulse{
  0%,100%{
    box-shadow:0 0 20px rgba(22,131,255,.25);
  }
  50%{
    box-shadow:
      0 0 35px rgba(22,131,255,.55),
      0 0 65px rgba(34,211,238,.12);
  }
}

.brand{
  font-size:18px;
  font-weight:900;
  letter-spacing:-.5px;
}

.version{
  margin-top:2px;
  font-size:10px;
  color:#54c7ff;
  letter-spacing:1.2px;
}

.live{
  display:flex;
  align-items:center;
  gap:6px;
  padding:8px 11px;
  border:1px solid rgba(56,189,248,.2);
  border-radius:999px;
  background:rgba(22,131,255,.08);
  color:#7dd3fc;
  font-size:10px;
}

.dot{
  width:6px;
  height:6px;
  border-radius:50%;
  background:#22d3ee;
  box-shadow:0 0 12px #22d3ee;
  animation:blink 1.4s infinite;
}

@keyframes blink{
  0%,100%{opacity:1}
  50%{opacity:.3}
}

.hero{
  position:relative;
  overflow:hidden;
  padding:22px;
  margin-bottom:14px;
  border-radius:27px;
  border:1px solid var(--line);
  background:
    linear-gradient(
      145deg,
      rgba(10,31,61,.95),
      rgba(4,13,27,.92)
    );
  box-shadow:var(--shadow);
}

.hero:before{
  content:"";
  position:absolute;
  width:210px;
  height:210px;
  right:-100px;
  top:-105px;
  border-radius:50%;
  background:rgba(22,131,255,.20);
  filter:blur(25px);
}

.hero-title{
  font-size:12px;
  color:var(--muted);
  margin-bottom:7px;
}

.hero-rate{
  font-size:31px;
  font-weight:950;
  letter-spacing:-1.5px;
}

.hero-rate span{
  color:#4cc9ff;
  text-shadow:0 0 22px rgba(56,189,248,.3);
}

.hero-sub{
  margin-top:7px;
  font-size:10px;
  color:#647991;
}

.refresh{
  position:absolute;
  right:18px;
  bottom:18px;
  padding:9px 11px;
  border:1px solid rgba(56,189,248,.18);
  border-radius:12px;
  background:rgba(22,131,255,.08);
  color:#7dd3fc;
  font-size:10px;
  cursor:pointer;
}

.refresh.spin{
  animation:spin .6s ease;
}

@keyframes spin{
  to{transform:rotate(360deg)}
}

.tabs{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:8px;
  margin-bottom:13px;
}

.tab{
  padding:12px 5px;
  border:1px solid var(--line);
  border-radius:15px;
  background:rgba(255,255,255,.025);
  color:#778ba3;
  font-size:12px;
  font-weight:800;
  cursor:pointer;
  transition:.25s;
}

.tab.active{
  color:white;
  border-color:rgba(56,189,248,.35);
  background:
    linear-gradient(
      135deg,
      rgba(22,131,255,.95),
      rgba(14,165,233,.88)
    );
  box-shadow:
    0 8px 30px rgba(22,131,255,.25),
    0 0 25px rgba(34,211,238,.08);
  transform:translateY(-1px);
}

.card{
  padding:18px;
  margin-bottom:13px;
  border:1px solid var(--line);
  border-radius:24px;
  background:
    linear-gradient(
      145deg,
      var(--card),
      var(--card2)
    );
  box-shadow:
    0 15px 50px rgba(0,0,0,.28),
    inset 0 1px rgba(255,255,255,.025);
  backdrop-filter:blur(18px);
  -webkit-backdrop-filter:blur(18px);
}

.label{
  display:block;
  margin-bottom:9px;
  color:#8195ac;
  font-size:11px;
}

.amount-box{
  display:flex;
  align-items:center;
  gap:10px;
  padding:5px 14px;
  border:1px solid rgba(120,180,255,.10);
  border-radius:17px;
  background:rgba(0,0,0,.18);
  transition:.25s;
}

.amount-box:focus-within{
  border-color:rgba(56,189,248,.55);
  box-shadow:0 0 28px rgba(22,131,255,.10);
}

.currency-symbol{
  color:#38bdf8;
  font-size:19px;
  font-weight:900;
}

input{
  width:100%;
  padding:13px 0;
  border:0;
  outline:0;
  background:transparent;
  color:white;
  font-size:24px;
  font-weight:850;
}

input::placeholder{
  color:#405168;
}

.direction{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:8px;
  margin-top:12px;
}

.dir{
  padding:11px;
  border:1px solid var(--line);
  border-radius:13px;
  background:rgba(255,255,255,.025);
  color:#8093a8;
  font-size:11px;
  font-weight:750;
  cursor:pointer;
}

.dir.active{
  border-color:rgba(56,189,248,.35);
  background:rgba(22,131,255,.09);
  color:#9cddff;
}

.result{
  margin-top:15px;
  padding:20px;
  border:1px solid rgba(56,189,248,.14);
  border-radius:19px;
  background:
    radial-gradient(
      circle at 100% 0%,
      rgba(22,131,255,.17),
      transparent 45%
    ),
    rgba(0,0,0,.18);
  text-align:center;
}

.result-label{
  margin-bottom:6px;
  color:#70859b;
  font-size:10px;
}

.result-value{
  color:#f5fbff;
  font-size:31px;
  font-weight:950;
  letter-spacing:-1.5px;
  text-shadow:0 0 25px rgba(56,189,248,.12);
}

.result-value.flash{
  animation:resultFlash .45s ease;
}

@keyframes resultFlash{
  0%{transform:scale(.96);opacity:.7}
  50%{
    transform:scale(1.04);
    text-shadow:0 0 30px rgba(56,189,248,.5);
  }
  100%{transform:scale(1);opacity:1}
}

.effective{
  margin-top:6px;
  color:#667b91;
  font-size:10px;
}

.whatsapp{
  width:100%;
  margin-top:12px;
  padding:15px;
  border:0;
  border-radius:17px;
  color:white;
  font-size:13px;
  font-weight:900;
  background:
    linear-gradient(
      135deg,
      #1677ff,
      #0ea5e9,
      #2563eb
    );
  box-shadow:
    0 12px 32px rgba(22,131,255,.25),
    inset 0 1px rgba(255,255,255,.3);
  cursor:pointer;
  transition:.2s;
}

.whatsapp:active{
  transform:scale(.97);
}

.section-head{
  display:flex;
  justify-content:space-between;
  align-items:center;
  margin-bottom:11px;
}

.section-title{
  font-size:13px;
  font-weight:850;
}

.section-small{
  color:#647990;
  font-size:9px;
}

.chart-wrap{
  height:180px;
}

.history{
  display:flex;
  flex-direction:column;
  gap:8px;
}

.history-item{
  display:flex;
  align-items:center;
  justify-content:space-between;
  padding:12px;
  border:1px solid rgba(255,255,255,.045);
  border-radius:14px;
  background:rgba(255,255,255,.025);
  animation:historyIn .35s ease;
}

@keyframes historyIn{
  from{
    opacity:0;
    transform:translateY(7px);
  }
  to{
    opacity:1;
    transform:translateY(0);
  }
}

.h-left{
  display:flex;
  flex-direction:column;
  gap:3px;
}

.h-main{
  font-size:12px;
  font-weight:800;
}

.h-date{
  color:#586d82;
  font-size:9px;
}

.h-right{
  color:#4cc9ff;
  font-size:12px;
  font-weight:850;
}

.tools{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:9px;
}

.tool{
  padding:12px;
  border:1px solid var(--line);
  border-radius:14px;
  background:rgba(255,255,255,.025);
  color:#adc0d3;
  font-size:10px;
  font-weight:750;
  cursor:pointer;
}

.tool:active{
  transform:scale(.97);
}

.admin{
  display:none;
  border-color:rgba(96,165,250,.18);
  background:rgba(22,131,255,.04);
}

.admin.show{
  display:block;
}

.admin-value{
  color:#60a5fa;
  font-size:22px;
  font-weight:900;
}

.footer{
  padding-top:15px;
  color:#3f536b;
  text-align:center;
  font-size:9px;
}

.toast{
  position:fixed;
  z-index:99;
  left:50%;
  bottom:25px;
  padding:11px 16px;
  border:1px solid rgba(56,189,248,.2);
  border-radius:14px;
  background:#091a31;
  color:#dff6ff;
  font-size:11px;
  box-shadow:0 10px 35px rgba(0,0,0,.5);
  opacity:0;
  pointer-events:none;
  transform:translate(-50%,20px);
  transition:.3s;
}

.toast.show{
  opacity:1;
  transform:translate(-50%,0);
}
</style>
</head>

<body>

<div class="app">

<header class="header">

  <div class="logo-wrap">

    <div class="logo" id="logo">
      PP
    </div>

    <div>
      <div class="brand">
        Pul Perewot
      </div>

      <div class="version">
        V12 • BLUE PREMIUM
      </div>
    </div>

  </div>

  <div class="live">
    <span class="dot"></span>
    LIVE
  </div>

</header>


<section class="hero">

  <div class="hero-title" id="marketTitle">
    USD / RUB
  </div>

  <div class="hero-rate">
    <span id="marketRate">--</span> RUB
  </div>

  <div class="hero-sub" id="updated">
    Kur ýüklenýär...
  </div>

  <button class="refresh" id="refreshBtn">
    ↻ Täzele
  </button>

</section>


<div class="tabs">

  <button class="tab active" data-currency="USD">
    🇺🇸 USD
  </button>

  <button class="tab" data-currency="EUR">
    🇪🇺 EUR
  </button>

  <button class="tab" data-currency="TRY">
    🇹🇷 TRY
  </button>

</div>


<section class="card">

  <label class="label">
    Pul mukdary
  </label>

  <div class="amount-box">

    <div
      class="currency-symbol"
      id="currencySymbol"
    >
      $
    </div>

    <input
      id="amount"
      type="number"
      inputmode="decimal"
      value="100"
      placeholder="100"
    >

  </div>


  <div class="direction">

    <button
      class="dir active"
      id="toRub"
    >
      <span id="toRubText">
        USD → RUB
      </span>
    </button>

    <button
      class="dir"
      id="fromRub"
    >
      RUB →
      <span id="fromRubText">
        USD
      </span>
    </button>

  </div>


  <div class="result">

    <div class="result-label">
      Alynjak summa
    </div>

    <div
      class="result-value"
      id="result"
    >
      0 RUB
    </div>

    <div
      class="effective"
      id="effective"
    >
      1 USD = -- RUB
    </div>

  </div>


  <button
    class="whatsapp"
    id="whatsapp"
  >
    WhatsApp arkaly Ugrat
  </button>

</section>


<section class="card">

  <div class="section-head">

    <div class="section-title">
      Kurs grafigi
    </div>

    <div class="section-small">
      V12 LIVE
    </div>

  </div>

  <div class="chart-wrap">
    <canvas id="chart"></canvas>
  </div>

</section>


<section class="card">

  <div class="section-head">

    <div class="section-title">
      Soňky hasaplamalar
    </div>

    <div
      class="section-small"
      id="historyCount"
    >
      0
    </div>

  </div>

  <div
    class="history"
    id="history"
  ></div>

</section>


<section class="card">

  <div class="section-head">

    <div class="section-title">
      Gurallar
    </div>

  </div>

  <div class="tools">

    <button class="tool" id="copyBtn">
      Kopyala
    </button>

    <button class="tool" id="shareBtn">
      Paýlaş
    </button>

    <button class="tool" id="clearBtn">
      Taryhy arassala
    </button>

    <button class="tool" id="receiptBtn">
      Çek görkez
    </button>

  </div>

</section>


<section
  class="card admin"
  id="adminPanel"
>

  <div class="section-head">

    <div class="section-title">
      Admin panel
    </div>

    <div class="section-small">
      V12
    </div>

  </div>

  <div style="margin-bottom:12px">

    <div class="section-small">
      Jemi giren
    </div>

    <div
      class="admin-value"
      id="totalVisits"
    >
      0
    </div>

  </div>

  <div>

    <div class="section-small">
      Şu gün
    </div>

    <div
      class="admin-value"
      id="todayVisits"
    >
      0
    </div>

  </div>

</section>


<div class="footer">
  Pul Perewot • V12 • Komissiýa 4.5%
</div>

</div>


<div
  class="toast"
  id="toast"
></div>


<script>

/* =========================================
   PUL PEREWOT V12
   KOMISSIÝA = 4.5%
========================================= */

const API_URL =
  "https://open.er-api.com/v6/latest/USD";

const PHONE =
  "79030156403";

/*
  GERÇEK KOMISSIÝA
  %4.5 = 1.045
*/
const COMMISSION_PERCENT = 4.5;
const COMMISSION_MULTIPLIER = 1.045;

const ADMIN_PASSWORD =
  "pul2026";


let currentCurrency =
  localStorage.getItem("favoriteCurrency") ||
  "USD";

let direction = "toRUB";


let rates = {

  USD:86.56,
  EUR:94.20,
  TRY:2.65

};


let previousRates = {

  USD:[],
  EUR:[],
  TRY:[]

};


const symbols = {

  USD:"$",
  EUR:"€",
  TRY:"₺"

};


const amountInput =
  document.getElementById("amount");

const result =
  document.getElementById("result");

const effectiveRate =
  document.getElementById("effective");

const marketRate =
  document.getElementById("marketRate");

const marketTitle =
  document.getElementById("marketTitle");

const currencySymbol =
  document.getElementById("currencySymbol");

const updated =
  document.getElementById("updated");

const historyBox =
  document.getElementById("history");

const toast =
  document.getElementById("toast");


let chart;


/* =========================================
   KOMISSIÝA
========================================= */

function calculateFinalRate(baseRate){

  /*
    Mysal:
    86.56 × 1.045 = 90.4552
  */

  return baseRate *
    COMMISSION_MULTIPLIER;

}


/* =========================================
   TOAST
========================================= */

function showToast(message){

  toast.textContent =
    message;

  toast.classList.add("show");

  clearTimeout(
    window.toastTimer
  );

  window.toastTimer =
    setTimeout(()=>{

      toast.classList.remove("show");

    },1800);

}


/* =========================================
   CALCULATE
========================================= */

function calculate(){

  const amount =
    parseFloat(
      String(
        amountInput.value
      )
      .replace(/\s/g,"")
      .replace(",",".")
    ) || 0;


  const baseRate =
    Number(
      rates[currentCurrency]
    );


  /*
    %4.5 komissiýa
  */

  const finalRate =
    calculateFinalRate(
      baseRate
    );


  let total;


  if(direction === "toRUB"){

    total =
      Math.round(
        amount * finalRate
      );


    result.textContent =
      total.toLocaleString(
        "ru-RU"
      ) + " RUB";


    effectiveRate.textContent =
      `1 ${currentCurrency} = ${finalRate.toFixed(2)} RUB`;

  }

  else{

    total =
      amount > 0
        ? amount / finalRate
        : 0;


    result.textContent =
      total.toFixed(2) +
      " " +
      currentCurrency;


    effectiveRate.textContent =
      `1 RUB = ${(1/finalRate).toFixed(4)} ${currentCurrency}`;

  }


  result.classList.remove(
    "flash"
  );

  void result.offsetWidth;

  result.classList.add(
    "flash"
  );

}


/* =========================================
   UI
========================================= */

function updateUI(){

  const baseRate =
    Number(
      rates[currentCurrency]
    );


  marketTitle.textContent =
    `${currentCurrency} / RUB`;


  marketRate.textContent =
    baseRate.toFixed(2);


  currencySymbol.textContent =
    direction === "toRUB"
      ? symbols[currentCurrency]
      : "₽";


  document
    .querySelectorAll(".tab")
    .forEach(tab=>{

      tab.classList.toggle(
        "active",
        tab.dataset.currency ===
        currentCurrency
      );

    });


  document
    .getElementById("toRubText")
    .textContent =
    `${currentCurrency} → RUB`;


  document
    .getElementById("fromRubText")
    .textContent =
    currentCurrency;


  document
    .getElementById("toRub")
    .classList.toggle(
      "active",
      direction === "toRUB"
    );


  document
    .getElementById("fromRub")
    .classList.toggle(
      "active",
      direction === "fromRUB"
    );


  calculate();

}


/* =========================================
   API
========================================= */

async function loadRates(){

  const refresh =
    document.getElementById(
      "refreshBtn"
    );


  refresh.classList.add(
    "spin"
  );


  try{

    const response =
      await fetch(
        API_URL,
        {
          cache:"no-store"
        }
      );


    const data =
      await response.json();


    if(
      data &&
      data.rates &&
      data.rates.RUB
    ){

      const usdRub =
        Number(
          data.rates.RUB
        );


      if(usdRub > 0){

        previousRates.USD.push(
          rates.USD
        );

        previousRates.USD =
          previousRates.USD.slice(-9);


        rates.USD =
          usdRub;


        if(data.rates.EUR){

          previousRates.EUR.push(
            rates.EUR
          );

          previousRates.EUR =
            previousRates.EUR.slice(-9);


          rates.EUR =
            usdRub /
            Number(data.rates.EUR);

        }


        if(data.rates.TRY){

          previousRates.TRY.push(
            rates.TRY
          );

          previousRates.TRY =
            previousRates.TRY.slice(-9);


          rates.TRY =
            usdRub /
            Number(data.rates.TRY);

        }


        updated.textContent =
          "Soňky täzelenme: " +
          new Date()
            .toLocaleTimeString(
              "tk-TM",
              {
                hour:"2-digit",
                minute:"2-digit"
              }
            );


        updateUI();

        updateChart();

        showToast(
          "Kurs täzelendi ✓"
        );

        return;

      }

    }


    throw new Error(
      "Rate error"
    );


  }catch(error){

    updated.textContent =
      "Soňky elýeterli kurs görkezilýär";

    showToast(
      "Kurs täzelenmedi"
    );

  }finally{

    setTimeout(()=>{

      refresh.classList.remove(
        "spin"
      );

    },600);

  }

}


/* =========================================
   CHART
========================================= */

function createChart(){

  const ctx =
    document
      .getElementById("chart")
      .getContext("2d");


  let values =
    previousRates[
      currentCurrency
    ].length

      ? previousRates[
          currentCurrency
        ]

      : [

        rates[currentCurrency] * .998,

        rates[currentCurrency] * .999,

        rates[currentCurrency],

        rates[currentCurrency] * 1.001,

        rates[currentCurrency]

      ];


  chart =
    new Chart(
      ctx,
      {

        type:"line",

        data:{

          labels:
            values.map(
              (_,i)=>i+1
            ),

          datasets:[{

            data:values,

            borderColor:
              "#38bdf8",

            backgroundColor:
              "rgba(22,131,255,.10)",

            borderWidth:2,

            pointRadius:0,

            tension:.42,

            fill:true

          }]

        },

        options:{

          responsive:true,

          maintainAspectRatio:false,

          plugins:{

            legend:{
              display:false
            }

          },

          scales:{

            x:{
              display:false
            },

            y:{

              ticks:{

                color:"#647990",

                font:{
                  size:9
                }

              },

              grid:{

                color:
                  "rgba(120,180,255,.06)"

              }

            }

          }

        }

      }
    );

}


function updateChart(){

  if(!chart){

    createChart();

    return;

  }


  let values =
    previousRates[
      currentCurrency
    ].length

      ? previousRates[
          currentCurrency
        ]

      : [
          rates[currentCurrency]
        ];


  values =
    [
      ...values,
      rates[currentCurrency]
    ].slice(-9);


  chart.data.labels =
    values.map(
      (_,i)=>i+1
    );


  chart.data.datasets[0]
    .data =
    values;


  chart.update(
    "none"
  );

}


/* =========================================
   HISTORY
========================================= */

function getHistory(){

  try{

    return JSON.parse(
      localStorage.getItem(
        "pulHistory"
      ) || "[]"
    );

  }catch{

    return [];

  }

}


function saveHistory(){

  const amount =
    parseFloat(
      amountInput.value
    ) || 0;


  if(!amount)
    return;


  const finalRate =
    calculateFinalRate(
      rates[currentCurrency]
    );


  const total =
    direction === "toRUB"

      ? Math.round(
          amount * finalRate
        )

      : amount / finalRate;


  const item = {

    currency:
      currentCurrency,

    direction,

    amount,

    total,

    rate:
      finalRate,

    commission:
      COMMISSION_PERCENT,

    date:
      new Date()
        .toLocaleString(
          "tk-TM"
        )

  };


  let history =
    getHistory();


  history.unshift(
    item
  );


  history =
    history.slice(
      0,
      10
    );


  localStorage.setItem(
    "pulHistory",
    JSON.stringify(history)
  );


  renderHistory();

}


function renderHistory(){

  const history =
    getHistory();


  document
    .getElementById(
      "historyCount"
    )
    .textContent =
    history.length;


  if(!history.length){

    historyBox.innerHTML =
      `
      <div style="
        text-align:center;
        padding:15px;
        color:#50647a;
        font-size:10px;
      ">
        Häzirlikçe taryh ýok
      </div>
      `;

    return;

  }


  historyBox.innerHTML =
    history
      .map(item=>{

        const total =
          item.direction === "toRUB"

            ? Number(
                item.total
              )
              .toLocaleString(
                "ru-RU"
              ) +
              " RUB"

            : Number(
                item.total
              )
              .toFixed(2) +
              " " +
              item.currency;


        return `

          <div class="history-item">

            <div class="h-left">

              <div class="h-main">
                ${item.amount}
                ${item.currency}
                →
                ${total}
              </div>

              <div class="h-date">
                ${item.date}
              </div>

            </div>

            <div class="h-right">
              ${Number(
                item.rate
              ).toFixed(2)}
            </div>

          </div>

        `;

      })
      .join("");

}

/* =========================================
   COPY
========================================= */

async function copyResult(){

  try{

    await navigator.clipboard
      .writeText(
        result.textContent
      );

    showToast(
      "Netije kopyalandy ✓"
    );

  }catch{

    showToast(
      "Kopyalamak bolmady"
    );

  }

}


/* =========================================
   SHARE
========================================= */

async function shareResult(){

  const text =
    `Pul Perewot V12\n${result.textContent}`;


  if(navigator.share){

    try{

      await navigator.share({

        title:
          "Pul Perewot",

        text

      });

    }catch{}

  }else{

    copyResult();

  }

}

/* =========================================
   ADMIN
========================================= */

function updateCounters(){

  let total =
    Number(
      localStorage.getItem(
        "pul-perewot-total"
      ) || 0
    );


  total++;


  localStorage.setItem(
    "pul-perewot-total",
    total
  );


  const todayKey =
    "pul-perewot-" +
    new Date()
      .toISOString()
      .slice(0,10);


  let today =
    Number(
      localStorage.getItem(
        todayKey
      ) || 0
    );


  today++;


  localStorage.setItem(
    todayKey,
    today
  );

}


function showAdmin(){

  const todayKey =

    new Date()
