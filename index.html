<!DOCTYPE html>
<html lang="tk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

<title>Pul Perewot — V11</title>

<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.4/dist/chart.umd.min.js"></script>

<style>
*{
  box-sizing:border-box;
  -webkit-tap-highlight-color:transparent;
}

:root{
  --bg:#050807;
  --bg2:#0a110f;
  --card:rgba(16,27,23,.82);
  --card2:rgba(21,35,30,.72);
  --green:#10b981;
  --green2:#34d399;
  --cyan:#2dd4bf;
  --text:#f4fff9;
  --muted:#91a89f;
  --line:rgba(255,255,255,.08);
  --danger:#fb7185;
  --shadow:0 20px 60px rgba(0,0,0,.45);
}

html,body{
  margin:0;
  min-height:100%;
  background:
    radial-gradient(circle at 20% 0%,rgba(16,185,129,.14),transparent 30%),
    radial-gradient(circle at 100% 30%,rgba(45,212,191,.08),transparent 30%),
    var(--bg);
  color:var(--text);
  font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","Segoe UI",sans-serif;
}

body{
  overflow-x:hidden;
}

body:before{
  content:"";
  position:fixed;
  inset:0;
  pointer-events:none;
  background:
    linear-gradient(120deg,transparent 0%,rgba(255,255,255,.015) 45%,transparent 55%);
  animation:ambient 8s ease-in-out infinite;
}

@keyframes ambient{
  0%,100%{opacity:.4;transform:translateX(-8%)}
  50%{opacity:1;transform:translateX(8%)}
}

.app{
  width:100%;
  max-width:430px;
  min-height:100vh;
  margin:auto;
  padding:18px 15px 35px;
  position:relative;
}

.header{
  display:flex;
  align-items:center;
  justify-content:space-between;
  margin-bottom:22px;
}

.logo-wrap{
  display:flex;
  align-items:center;
  gap:11px;
}

.logo{
  width:45px;
  height:45px;
  border-radius:15px;
  display:flex;
  align-items:center;
  justify-content:center;
  font-weight:900;
  font-size:18px;
  color:#03130d;
  background:linear-gradient(135deg,#34d399,#10b981,#2dd4bf);
  box-shadow:
    0 0 25px rgba(16,185,129,.28),
    inset 0 1px 1px rgba(255,255,255,.45);
  cursor:pointer;
  user-select:none;
  animation:logoPulse 3s infinite;
}

@keyframes logoPulse{
  0%,100%{box-shadow:0 0 18px rgba(16,185,129,.22)}
  50%{box-shadow:0 0 30px rgba(16,185,129,.42)}
}

.brand{
  font-size:18px;
  font-weight:850;
  letter-spacing:-.5px;
}

.version{
  font-size:10px;
  color:var(--green2);
  margin-top:2px;
  letter-spacing:1px;
}

.live{
  display:flex;
  align-items:center;
  gap:6px;
  padding:8px 11px;
  border:1px solid rgba(16,185,129,.18);
  border-radius:999px;
  background:rgba(16,185,129,.07);
  font-size:10px;
  color:#7ff5c9;
  box-shadow:0 0 20px rgba(16,185,129,.07);
}

.dot{
  width:6px;
  height:6px;
  background:#22c55e;
  border-radius:50%;
  box-shadow:0 0 10px #22c55e;
  animation:blink 1.5s infinite;
}

@keyframes blink{
  0%,100%{opacity:1}
  50%{opacity:.3}
}

.hero{
  position:relative;
  overflow:hidden;
  border:1px solid var(--line);
  border-radius:27px;
  padding:21px;
  background:
    linear-gradient(145deg,rgba(18,37,29,.95),rgba(8,17,14,.88));
  box-shadow:var(--shadow);
  margin-bottom:14px;
}

.hero:after{
  content:"";
  position:absolute;
  width:180px;
  height:180px;
  right:-80px;
  top:-90px;
  border-radius:50%;
  background:rgba(16,185,129,.14);
  filter:blur(25px);
}

.hero-title{
  font-size:13px;
  color:var(--muted);
  margin-bottom:7px;
}

.hero-rate{
  font-size:30px;
  font-weight:900;
  letter-spacing:-1.3px;
}

.hero-rate span{
  color:var(--green2);
}

.hero-sub{
  margin-top:8px;
  font-size:11px;
  color:#71877e;
}

.refresh{
  position:absolute;
  right:18px;
  bottom:18px;
  border:1px solid rgba(16,185,129,.18);
  background:rgba(16,185,129,.08);
  color:#82f4c9;
  border-radius:12px;
  padding:9px 11px;
  font-size:11px;
  cursor:pointer;
}

.refresh.spin{
  animation:spin .6s ease;
}

@keyframes spin{
  to{transform:rotate(360deg)}
}

.tabs{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:8px;
  margin-bottom:13px;
}

.tab{
  border:1px solid var(--line);
  border-radius:15px;
  padding:12px 5px;
  background:rgba(255,255,255,.025);
  color:#849a91;
  font-size:12px;
  font-weight:700;
  cursor:pointer;
  transition:.25s;
}

.tab.active{
  color:#07120e;
  background:linear-gradient(135deg,#34d399,#10b981);
  border-color:transparent;
  box-shadow:0 7px 25px rgba(16,185,129,.2);
  transform:translateY(-1px);
}

.card{
  background:linear-gradient(145deg,var(--card),var(--card2));
  border:1px solid var(--line);
  border-radius:24px;
  padding:18px;
  margin-bottom:13px;
  box-shadow:0 15px 45px rgba(0,0,0,.23);
  backdrop-filter:blur(16px);
  -webkit-backdrop-filter:blur(16px);
}

.label{
  display:block;
  color:#81978e;
  font-size:11px;
  margin-bottom:9px;
}

.amount-box{
  display:flex;
  align-items:center;
  gap:10px;
  border:1px solid rgba(255,255,255,.08);
  border-radius:17px;
  padding:5px 14px;
  background:rgba(0,0,0,.17);
  transition:.25s;
}

.amount-box:focus-within{
  border-color:rgba(16,185,129,.55);
  box-shadow:0 0 25px rgba(16,185,129,.08);
}

.currency-symbol{
  color:var(--green2);
  font-size:19px;
  font-weight:900;
}

input{
  width:100%;
  border:0;
  outline:0;
  background:transparent;
  color:white;
  font-size:24px;
  font-weight:800;
  padding:13px 0;
}

input::placeholder{
  color:#42534c;
}

.direction{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:8px;
  margin-top:12px;
}

.dir{
  padding:11px;
  border-radius:13px;
  border:1px solid var(--line);
  background:rgba(255,255,255,.025);
  color:#81978e;
  font-size:11px;
  font-weight:700;
  cursor:pointer;
}

.dir.active{
  border-color:rgba(16,185,129,.4);
  color:#a9f9dc;
  background:rgba(16,185,129,.08);
}

.result{
  margin-top:15px;
  padding:19px;
  border-radius:19px;
  background:
    radial-gradient(circle at 100% 0%,rgba(16,185,129,.15),transparent 42%),
    rgba(0,0,0,.18);
  border:1px solid rgba(16,185,129,.13);
  text-align:center;
}

.result-label{
  color:#789088;
  font-size:10px;
  margin-bottom:6px;
}

.result-value{
  font-size:31px;
  font-weight:950;
  letter-spacing:-1.5px;
  color:#eafff6;
  transition:.25s;
}

.result-value.flash{
  animation:resultFlash .45s ease;
}

@keyframes resultFlash{
  0%{transform:scale(.96);filter:brightness(1)}
  50%{transform:scale(1.04);filter:brightness(1.3)}
  100%{transform:scale(1)}
}

.effective{
  margin-top:6px;
  font-size:10px;
  color:#6e847b;
}

.whatsapp{
  width:100%;
  border:0;
  border-radius:17px;
  padding:15px;
  margin-top:12px;
  font-size:13px;
  font-weight:850;
  color:#04120c;
  background:linear-gradient(135deg,#34d399,#10b981);
  box-shadow:
    0 10px 30px rgba(16,185,129,.2),
    inset 0 1px rgba(255,255,255,.35);
  cursor:pointer;
  transition:.2s;
}

.whatsapp:active{
  transform:scale(.97);
}

.section-head{
  display:flex;
  justify-content:space-between;
  align-items:center;
  margin-bottom:11px;
}

.section-title{
  font-size:13px;
  font-weight:800;
}

.section-small{
  font-size:9px;
  color:#668078;
}

.chart-wrap{
  height:180px;
}

.history{
  display:flex;
  flex-direction:column;
  gap:8px;
}

.history-item{
  display:flex;
  justify-content:space-between;
  align-items:center;
  padding:12px;
  border-radius:14px;
  background:rgba(255,255,255,.025);
  border:1px solid rgba(255,255,255,.045);
  animation:historyIn .35s ease;
}

@keyframes historyIn{
  from{opacity:0;transform:translateY(7px)}
  to{opacity:1;transform:translateY(0)}
}

.h-left{
  display:flex;
  flex-direction:column;
  gap:3px;
}

.h-main{
  font-size:12px;
  font-weight:800;
}

.h-date{
  font-size:9px;
  color:#60766d;
}

.h-right{
  color:#77eac0;
  font-size:12px;
  font-weight:800;
}

.tools{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:9px;
}

.tool{
  border:1px solid var(--line);
  background:rgba(255,255,255,.025);
  color:#b4c6bf;
  padding:12px;
  border-radius:14px;
  font-size:10px;
  font-weight:700;
  cursor:pointer;
}

.tool:active{
  transform:scale(.97);
}

.footer{
  text-align:center;
  padding:15px 0 0;
  color:#42554e;
  font-size:9px;
}

.admin{
  display:none;
  border:1px solid rgba(251,113,133,.2);
  background:rgba(251,113,133,.04);
}

.admin.show{
  display:block;
}

.admin-value{
  font-size:22px;
  font-weight:900;
  color:#fda4af;
}

.toast{
  position:fixed;
  left:50%;
  bottom:25px;
  transform:translate(-50%,20px);
  background:#15251f;
  border:1px solid rgba(16,185,129,.2);
  color:#d9fff0;
  padding:11px 16px;
  border-radius:14px;
  font-size:11px;
  opacity:0;
  pointer-events:none;
  transition:.3s;
  z-index:99;
  box-shadow:0 10px 35px rgba(0,0,0,.4);
}

.toast.show{
  opacity:1;
  transform:translate(-50%,0);
}

@media(prefers-reduced-motion:no-preference){
  .card,.hero{
    animation:cardIn .55s ease both;
  }
}

@keyframes cardIn{
  from{opacity:0;transform:translateY(10px)}
  to{opacity:1;transform:translateY(0)}
}
</style>
</head>

<body>

<div class="app">

  <header class="header">
    <div class="logo-wrap">
      <div class="logo" id="logo">PP</div>
      <div>
        <div class="brand">Pul Perewot</div>
        <div class="version">V11 • PREMIUM</div>
      </div>
    </div>

    <div class="live">
      <span class="dot"></span>
      LIVE
    </div>
  </header>

  <section class="hero">
    <div class="hero-title" id="marketTitle">USD / RUB</div>
    <div class="hero-rate">
      <span id="marketRate">--</span> RUB
    </div>
    <div class="hero-sub" id="updated">
      Kur ýüklenýär...
    </div>

    <button class="refresh" id="refreshBtn">
      ↻ Täzele
    </button>
  </section>

  <div class="tabs">
    <button class="tab active" data-currency="USD">🇺🇸 USD</button>
    <button class="tab" data-currency="EUR">🇪🇺 EUR</button>
    <button class="tab" data-currency="TRY">🇹🇷 TRY</button>
  </div>

  <section class="card">

    <label class="label">Pul mukdary</label>

    <div class="amount-box">
      <div class="currency-symbol" id="currencySymbol">$</div>
      <input
        id="amount"
        type="number"
        inputmode="decimal"
        placeholder="100"
        value="100"
      >
    </div>

    <div class="direction">
      <button class="dir active" id="toRub">
        <span id="toRubText">USD → RUB</span>
      </button>

      <button class="dir" id="fromRub">
        RUB → <span id="fromRubText">USD</span>
      </button>
    </div>

    <div class="result">
      <div class="result-label">Alynjak summa</div>
      <div class="result-value" id="result">0 RUB</div>
      <div class="effective" id="effective">
        1 USD = -- RUB
      </div>
    </div>

    <button class="whatsapp" id="whatsapp">
      WhatsApp arkaly Ugrat
    </button>

  </section>

  <section class="card">

    <div class="section-head">
      <div class="section-title">Kurs grafigi</div>
      <div class="section-small">Soňky maglumatlar</div>
    </div>

    <div class="chart-wrap">
      <canvas id="chart"></canvas>
    </div>

  </section>

  <section class="card">

    <div class="section-head">
      <div class="section-title">Soňky hasaplamalar</div>
      <div class="section-small" id="historyCount">0</div>
    </div>

    <div class="history" id="history"></div>

  </section>

  <section class="card">

    <div class="section-head">
      <div class="section-title">Gurallar</div>
    </div>

    <div class="tools">
      <button class="tool" id="copyBtn">Kopyala</button>
      <button class="tool" id="shareBtn">Paýlaş</button>
      <button class="tool" id="clearBtn">Taryhy arassala</button>
      <button class="tool" id="receiptBtn">Çek görkez</button>
    </div>

  </section>

  <section class="card admin" id="adminPanel">
    <div class="section-head">
      <div class="section-title">Admin panel</div>
      <div class="section-small">V11</div>
    </div>

    <div style="margin-bottom:12px">
      <div class="section-small">Jemi giren</div>
      <div class="admin-value" id="totalVisits">0</div>
    </div>

    <div>
      <div class="section-small">Şu gün</div>
      <div class="admin-value" id="todayVisits">0</div>
    </div>
  </section>

  <div class="footer">
    Pul Perewot • V11 • 4.5% komissiýa
  </div>

</div>

<div class="toast" id="toast"></div>

<script>

/* =========================================
   PUL PEREWOT V11
   KOMISSIÝA: 4.5%
========================================= */

const API_URL = "https://open.er-api.com/v6/latest/USD";

const PHONE = "79030156403";

/* 4.5% KOMISSIÝA */
const COMMISSION = 1.045;

const ADMIN_PASSWORD = "pul2026";

let currentCurrency =
  localStorage.getItem("favoriteCurrency") || "USD";

let direction = "toRUB";

let rates = {
  USD: 86.56,
  EUR: 94.20,
  TRY: 2.65
};

let previousRates = {
  USD: [],
  EUR: [],
  TRY: []
};

const symbols = {
  USD:"$",
  EUR:"€",
  TRY:"₺"
};

const amountInput =
  document.getElementById("amount");

const result =
  document.getElementById("result");

const effectiveRate =
  document.getElementById("effective");

const marketRate =
  document.getElementById("marketRate");

const marketTitle =
  document.getElementById("marketTitle");

const currencySymbol =
  document.getElementById("currencySymbol");

const updated =
  document.getElementById("updated");

const historyBox =
  document.getElementById("history");

const toast =
  document.getElementById("toast");

let chart;

/* =========================================
   TOAST
========================================= */

function showToast(message){

  toast.textContent = message;
  toast.classList.add("show");

  clearTimeout(window.toastTimer);

  window.toastTimer = setTimeout(()=>{
    toast.classList.remove("show");
  },1800);
}

/* =========================================
   RATE CALCULATION
========================================= */

function getFinalRate(){

  return rates[currentCurrency] * COMMISSION;

}

function calculate(){

  const amount =
    parseFloat(
      String(amountInput.value)
      .replace(/\s/g,"")
      .replace(",",".")
    ) || 0;

  const rawRate =
    rates[currentCurrency];

  const finalRate =
    rawRate * COMMISSION;

  let total;

  if(direction === "toRUB"){

    total =
      Math.round(amount * finalRate);

    result.textContent =
      total.toLocaleString("ru-RU") + " RUB";

    effectiveRate.textContent =
      `1 ${currentCurrency} = ${finalRate.toFixed(2)} RUB`;

  }else{

    total =
      amount > 0
        ? amount / finalRate
        : 0;

    result.textContent =
      total.toFixed(2) + " " + currentCurrency;

    effectiveRate.textContent =
      `1 RUB = ${(1/finalRate).toFixed(4)} ${currentCurrency}`;
  }

  result.classList.remove("flash");

  void result.offsetWidth;

  result.classList.add("flash");

}

/* =========================================
   UI
========================================= */

function updateUI(){

  const rawRate =
    rates[currentCurrency];

  marketTitle.textContent =
    `${currentCurrency} / RUB`;

  marketRate.textContent =
    rawRate.toFixed(2);

  currencySymbol.textContent =
    direction === "toRUB"
      ? symbols[currentCurrency]
      : "₽";

  document.querySelectorAll(".tab")
    .forEach(tab=>{

      tab.classList.toggle(
        "active",
        tab.dataset.currency === currentCurrency
      );

    });

  document.getElementById("toRubText")
    .textContent =
    `${currentCurrency} → RUB`;

  document.getElementById("fromRubText")
    .textContent =
    currentCurrency;

  document.getElementById("toRub")
    .classList.toggle(
      "active",
      direction === "toRUB"
    );

  document.getElementById("fromRub")
    .classList.toggle(
      "active",
      direction === "fromRUB"
    );

  calculate();

}

/* =========================================
   API
========================================= */

async function loadRates(){

  const refresh =
    document.getElementById("refreshBtn");

  refresh.classList.add("spin");

  try{

    const response =
      await fetch(API_URL, {
        cache:"no-store"
      });

    const data =
      await response.json();

    if(
      data &&
      data.rates &&
      data.rates.RUB
    ){

      const usdRub =
        Number(data.rates.RUB);

      if(usdRub > 0){

        previousRates.USD.push(rates.USD);
        previousRates.USD =
          previousRates.USD.slice(-8);

        rates.USD =
          usdRub;

        /*
          EUR ve TRY:
          API USD bazlı geldiği için
          çapraz hesaplama yapılır.
        */

        if(data.rates.EUR){
          previousRates.EUR.push(rates.EUR);
          previousRates.EUR =
            previousRates.EUR.slice(-8);

          rates.EUR =
            usdRub / Number(data.rates.EUR);
        }

        if(data.rates.TRY){
          previousRates.TRY.push(rates.TRY);
          previousRates.TRY =
            previousRates.TRY.slice(-8);

          rates.TRY =
            usdRub / Number(data.rates.TRY);
        }

        updated.textContent =
          "Soňky täzelenme: " +
          new Date().toLocaleTimeString(
            "tk-TM",
            {
              hour:"2-digit",
              minute:"2-digit"
            }
          );

        updateUI();
        updateChart();

        showToast("Kurs täzelendi ✓");

        return;
      }
    }

    throw new Error("Rate error");

  }catch(error){

    updated.textContent =
      "Soňky elýeterli kurs görkezilýär";

    showToast("Kurs täzelenmedi");

  }finally{

    setTimeout(()=>{
      refresh.classList.remove("spin");
    },600);

  }

}

/* =========================================
   CHART
========================================= */

function createChart(){

  const ctx =
    document
      .getElementById("chart")
      .getContext("2d");

  const values =
    previousRates[currentCurrency].length
      ? previousRates[currentCurrency]
      : [
          rates[currentCurrency] * .998,
          rates[currentCurrency] * .999,
          rates[currentCurrency],
          rates[currentCurrency] * 1.001,
          rates[currentCurrency]
        ];

  chart =
    new Chart(ctx,{

      type:"line",

      data:{
        labels:values.map((_,i)=>i+1),

        datasets:[{
          data:values,
          borderColor:"#34d399",
          backgroundColor:"rgba(16,185,129,.10)",
          borderWidth:2,
          pointRadius:0,
          tension:.42,
          fill:true
        }]
      },

      options:{
        responsive:true,
        maintainAspectRatio:false,

        plugins:{
          legend:{
            display:false
          }
        },

        scales:{
          x:{
            display:false
          },

          y:{
            display:true,

            ticks:{
              color:"#60766d",
              font:{
                size:9
              }
            },

            grid:{
              color:"rgba(255,255,255,.045)"
            }
          }
        }
      }

    });

}

function updateChart(){

  if(!chart){
    createChart();
    return;
  }

  let values =
    previousRates[currentCurrency].length
      ? previousRates[currentCurrency]
      : [rates[currentCurrency]];

  values = [
    ...values,
    rates[currentCurrency]
  ].slice(-9);

  chart.data.labels =
    values.map((_,i)=>i+1);

  chart.data.datasets[0].data =
    values;

  chart.update("none");

}

/* =========================================
   HISTORY
========================================= */

function getHistory(){

  try{
    return JSON.parse(
      localStorage.getItem("pulHistory") || "[]"
    );
  }catch{
    return [];
  }

}

function saveHistory(){

  const amount =
    parseFloat(amountInput.value) || 0;

  if(!amount) return;

  const finalRate =
    getFinalRate();

  const total =
    direction === "toRUB"
      ? Math.round(amount * finalRate)
      : amount / finalRate;

  const item = {
    currency:currentCurrency,
    direction,
    amount,
    total,
    rate:finalRate,
    date:new Date().toLocaleString("tk-TM")
  };

  let history =
    getHistory();

  history.unshift(item);

  history =
    history.slice(0,10);

  localStorage.setItem(
    "pulHistory",
    JSON.stringify(history)
  );

  renderHistory();

}

function renderHistory(){

  const history =
    getHistory();

  document.getElementById("historyCount")
    .textContent =
    history.length;

  if(!history.length){

    historyBox.innerHTML =
      `<div style="
        text-align:center;
        padding:15px;
        color:#50645c;
        font-size:10px;
      ">Häzirlikçe taryh ýok</div>`;

    return;
  }

  historyBox.innerHTML =
    history.map(item=>{

      const total =
        item.direction === "toRUB"
          ? Number(item.total)
              .toLocaleString("ru-RU") + " RUB"
          : Number(item.total)
              .toFixed(2) + " " + item.currency;

      return `
        <div class="history-item">

          <div class="h-left">

            <div class="h-main">
              ${item.amount} ${item.currency}
              →
              ${total}
            </div>

            <div class="h-date">
              ${item.date}
            </div>

          </div>

          <div class="h-right">
            ${Number(item.rate).toFixed(2)}
          </div>

        </div>
      `;

    }).join("");

}

/* =========================================
   WHATSAPP
========================================= */

function sendWhatsApp(){

  const amount =
    parseFloat(amountInput.value) || 0;

  const finalRate =
    getFinalRate();

  let total;

  if(direction === "toRUB"){

    total =
      Math.round(amount * finalRate);

  }else{

    total =
      amount / finalRate;

  }

  const message =
`Salam! Pul Perewot

${amount} ${currentCurrency}
Kurs: ${finalRate.toFixed(2)} RUB
Komissiýa: 4.5%

Netije:
${direction === "toRUB"
  ? total.toLocaleString("ru-RU") + " RUB"
  : total.toFixed(2) + " " + currentCurrency}

Pul Perewot V11`;

  window.open(
    "https://wa.me/" +
    PHONE +
    "?text=" +
    encodeURIComponent(message),
    "_blank"
  );

}

/* =========================================
   COPY
========================================= */

async function copyResult(){

  const text =
    result.textContent;

  try{

    await navigator.clipboard.writeText(text);

    showToast("Netije kopyalandy ✓");

  }catch{

    showToast("Kopyalamak bolmady");

  }

}

/* =========================================
   SHARE
========================================= */

async function shareResult(){

  const text =
    `Pul Perewot V11\n${result.textContent}`;

  if(navigator.share){

    try{

      await navigator.share({
        title:"Pul Perewot",
        text
      });

    }catch{}

  }else{

    copyResult();

  }

}

/* =========================================
   RECEIPT
========================================= */

function showReceipt(){

  const amount =
    parseFloat(amountInput.value) || 0;

  const finalRate =
    getFinalRate();

  const total =
    direction === "toRUB"
      ? Math.round(amount * finalRate)
      : amount / finalRate;

  alert(
`PUL PEREWOT V11

${amount} ${currentCurrency}

Kurs:
${finalRate.toFixed(2)} RUB

Komissiýa:
4.5%

Netije:
${
  direction === "toRUB"
    ? total.toLocaleString("ru-RU")+" RUB"
    : total.toFixed(2)+" "+currentCurrency
}

Sag boluň!`
  );

}

/* =========================================
   ADMIN COUNTER
========================================= */

function updateCounters(){

  let total =
    Number(
      localStorage.getItem(
        "pul-perewot-total"
      ) || 0
    );

  total++;

  localStorage.setItem(
    "pul-perewot-total",
    total
  );

  const todayKey =
    "pul-perewot-" +
    new Date().toISOString().slice(0,10);

  let today =
    Number(
      localStorage.getItem(todayKey) || 0
    );

  today++;

  localStorage.setItem(
    todayKey,
    today
  );

}

function showAdmin(){

  const password =
    prompt("Admin paroly:");

  if(password !== ADMIN_PASSWORD){

    showToast("Parol nädogry");

    return;
  }

  const total =
    Number(
      localStorage.getItem(
        "pul-perewot-total"
      ) || 0
    );

  const todayKey =
    "pul-perewot-" +
    new Date().toISOString().slice(0,10);

  const today =
    Number(
      localStorage.getItem(todayKey) || 0
    );

  document.getElementById("totalVisits")
    .textContent = total;

  document.getElementById("todayVisits")
    .textContent = today;

  document.getElementById("adminPanel")
    .classList.add("show");

  showToast("Admin panel açyldy");

}
