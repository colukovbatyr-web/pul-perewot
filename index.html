<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Admin Panel V15</title>

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    min-height: 100vh;
    overflow: hidden;
    display: flex;
    justify-content: center;
    align-items: center;
    font-family: Arial, sans-serif;
    background:
        radial-gradient(circle at 20% 20%, #123b72 0%, transparent 35%),
        radial-gradient(circle at 80% 80%, #092b52 0%, transparent 35%),
        #020617;
    color: white;
}

/* Hareketli ışıklar */

.light {
    position: fixed;
    width: 250px;
    height: 250px;
    border-radius: 50%;
    filter: blur(80px);
    opacity: .35;
    background: #008cff;
    animation: float 8s infinite alternate ease-in-out;
}

.light.one {
    top: -80px;
    left: -80px;
}

.light.two {
    right: -80px;
    bottom: -80px;
    background: #6c00ff;
    animation-delay: 2s;
}

@keyframes float {
    from {
        transform: translate(0,0);
    }

    to {
        transform: translate(100px,70px);
    }
}

/* Login */

.login {
    position: relative;
    width: 360px;
    padding: 40px 32px;
    border-radius: 24px;

    background: rgba(15,23,42,.72);
    border: 1px solid rgba(255,255,255,.15);

    backdrop-filter: blur(20px);

    box-shadow:
        0 0 50px rgba(0,136,255,.25),
        inset 0 0 30px rgba(255,255,255,.03);

    animation: show .8s ease;
}

@keyframes show {
    from {
        opacity: 0;
        transform: translateY(50px) scale(.85);
    }

    to {
        opacity: 1;
        transform: translateY(0) scale(1);
    }
}

.logo {
    width: 70px;
    height: 70px;
    margin: 0 auto 18px;

    display: flex;
    align-items: center;
    justify-content: center;

    border-radius: 20px;

    background: linear-gradient(
        135deg,
        #0077ff,
        #00c6ff
    );

    font-size: 28px;
    font-weight: bold;

    box-shadow:
        0 0 25px rgba(0,150,255,.65);

    animation: pulse 2s infinite;
}

@keyframes pulse {
    0%,100% {
        box-shadow: 0 0 20px rgba(0,150,255,.5);
    }

    50% {
        box-shadow: 0 0 45px rgba(0,150,255,.9);
    }
}

h1 {
    margin: 0;
    text-align: center;
    font-size: 27px;
}

.version {
    text-align: center;
    margin-top: 8px;
    margin-bottom: 30px;

    color: #43b5ff;

    font-size: 13px;
    font-weight: bold;

    letter-spacing: 4px;

    text-shadow:
        0 0 10px #008cff;
}

/* Inputs */

.input-box {
    position: relative;
    margin-bottom: 16px;
}

input {
    width: 100%;
    padding: 15px 45px 15px 15px;

    border: 1px solid rgba(255,255,255,.12);
    border-radius: 12px;

    outline: none;

    background: rgba(0,0,0,.30);

    color: white;
    font-size: 15px;

    transition: .3s;
}

input::placeholder {
    color: #94a3b8;
}

input:focus {
    border-color: #168cff;

    box-shadow:
        0 0 15px rgba(0,140,255,.35);
}

/* Şifre göster */

.eye {
    position: absolute;
    right: 14px;
    top: 50%;

    transform: translateY(-50%);

    cursor: pointer;
    color: #94a3b8;
}

/* Button */

button {
    width: 100%;
    padding: 15px;

    border: none;
    border-radius: 12px;

    cursor: pointer;

    color: white;

    font-size: 15px;
    font-weight: bold;

    background:
        linear-gradient(
            90deg,
            #006eff,
            #00b7ff,
            #006eff
        );

    background-size: 200%;

    box-shadow:
        0 0 20px rgba(0,120,255,.35);

    transition: .3s;

    animation: gradient 3s infinite linear;
}

@keyframes gradient {
    0% {
        background-position: 0%;
    }

    100% {
        background-position: 200%;
    }
}

button:hover {
    transform: translateY(-2px);

    box-shadow:
        0 0 35px rgba(0,150,255,.7);
}

button:active {
    transform: scale(.97);
}

#message {
    min-height: 22px;

    margin-top: 18px;

    text-align: center;

    font-size: 14px;
}

/* Hata */

.error {
    animation: shake .45s;
}

@keyframes shake {
    0%,100% {
        transform: translateX(0);
    }

    20% {
        transform: translateX(-10px);
    }

    40% {
        transform: translateX(10px);
    }

    60% {
        transform: translateX(-7px);
    }

    80% {
        transform: translateX(7px);
    }
}

/* Başarılı */

.success {
    animation: success .5s;
}

@keyframes success {
    0% {
        transform: scale(1);
    }

    50% {
        transform: scale(1.04);
    }

    100% {
        transform: scale(1);
    }
}

.footer {
    margin-top: 25px;

    text-align: center;

    color: #64748b;

    font-size: 11px;
}
</style>
</head>

<body>

<div class="light one"></div>
<div class="light two"></div>

<div class="login" id="loginBox">

    <div class="logo">
        V15
    </div>

    <h1>Admin Panel</h1>

    <div class="version">
        PUL PEREWOT • V15
    </div>

    <div class="input-box">

        <input
            type="password"
            id="password"
            placeholder="Admin şifresi"
            autocomplete="current-password"
        >

        <span
            class="eye"
            onclick="togglePassword()"
        >
            👁
        </span>

    </div>

    <button onclick="login()">
        GİRİŞ YAP
    </button>

    <div id="message"></div>

    <div class="footer">
        Secure Administration • V15
    </div>

</div>

<script>

/* ==================================
   ADMIN ŞİFRESİ
   ================================== */

const ADMIN_PASSWORD = "Perewot!V15_2026#X7mQ@R4zK";


/* ==================================
   ŞİFRE GÖSTER / GİZLE
   ================================== */

function togglePassword() {

    const input =
        document.getElementById("password");

    if (input.type === "password") {

        input.type = "text";

    } else {

        input.type = "password";

    }
}


/* ==================================
   GİRİŞ
   ================================== */

function login() {

    const input =
        document.getElementById("password");

    const message =
        document.getElementById("message");

    const box =
        document.getElementById("loginBox");

    const password =
        input.value;

    box.classList.remove(
        "error",
        "success"
    );

    if (password === ADMIN_PASSWORD) {

        message.textContent =
            "✓ Giriş başarılı";

        message.style.color =
            "#4ade80";

        box.classList.add(
            "success"
        );

        setTimeout(() => {

            message.textContent =
                "V15 Admin Paneline hoş geldiniz.";

        }, 700);

    } else {

        message.textContent =
            "✕ Şifre yanlış";

        message.style.color =
            "#ff5c5c";

        box.classList.add(
            "error"
        );

        input.value = "";

    }
}


/* Enter tuşu */

document
    .getElementById("password")
    .addEventListener(
        "keydown",
        function(event) {

            if (event.key === "Enter") {

                login();

            }

        }
    );

</script>

</body>
</html>
