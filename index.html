@keyframes ping{0%{box-shadow:0 0 0 0 rgba(255,255,255,.55)}100%{box-shadow:0 0 0 30px rgba(255,255,255,0)}}
@keyframes pop{0%{transform:scale(.2);opacity:0}70%{transform:scale(1.15)}100%{transform:scale(1);opacity:1}}

.amounts button{transition:transform .12s}.amounts button:active{transform:scale(.94)}

    shown = Math.round(from + (tg - from) * e);
    show(shown);
    if (p < 1) raf = requestAnimationFrame(step);
  })(t0);
}
function apply(){
  var d = T[lang];
  document.documentElement.lang = lang === "tk" ? "tk" : lang;
  document.title = d.title;
  document.querySelectorAll("[data-i]").forEach(function(el){ el.textContent = d[el.dataset.i]; });
  document.querySelectorAll("[data-ph]").forEach(function(el){ el.placeholder = d[el.dataset.ph]; el.setAttribute("aria-label", d[el.dataset.ph]); });
  document.querySelectorAll(".lang button").forEach(function(b){ b.setAttribute("aria-pressed", String(b.dataset.l === lang)); });
  $("convRate").textContent = d.rate;
  applyService();
  render();
}
document.querySelectorAll(".lang button").forEach(function(b){
  b.addEventListener("click", function(){ lang = b.dataset.l; er.textContent = ""; apply(); });
});

function applyService(){
  var d = T[lang], tm = service === "tm";
  document.querySelectorAll(".svc button").forEach(function(b){ b.setAttribute("aria-pressed", String(b.dataset.s === service)); });
  var ttl = d.ttl.replace("{s}", SV[service].name);
  document.querySelector("h1").textContent = ttl; document.title = ttl;
  $("pl").textContent = tm ? d.phoneLbl : (service === "wf" ? d.wfLbl : d.bfLbl);
  $("pf").style.display = tm ? "" : "none";
  ph.maxLength = tm ? 9 : 40; ph.inputMode = tm ? "numeric" : "text";
  ph.placeholder = tm ? "65 123456" : d.idPh;
}
document.querySelectorAll(".svc button").forEach(function(b){
  b.addEventListener("click", function(){ service = b.dataset.s; ph.value = ""; er.textContent = ""; applyService(); });
});
function pick(a){
  amount = a;
  btns.forEach(function(b){ b.setAttribute("aria-pressed", String(Number(b.dataset.a) === a && !cu.value)); });
  render();
}
btns.forEach(function(b){ b.addEventListener("click", function(){ cu.value = ""; pick(Number(b.dataset.a)); }); });
cu.addEventListener("input", function(){
  cu.value = cu.value.replace(/\D/g, "");
  amount = Number(cu.value) || 0;
  btns.forEach(function(b){ b.setAttribute("aria-pressed", "false"); });
  render();
});
ph.addEventListener("input", function(){ if (service === "tm") ph.value = ph.value.replace(/[^\d ]/g, ""); });

$("go").addEventListener("click", function(){
  var d = ph.value.replace(/\D/g, ""), idv = ph.value.trim();
  if (service === "tm" ? d.length !== 8 : idv.length < 3) { er.textContent = service === "tm" ? T[lang].errPhone : T[lang].errId; ph.focus(); return; }
  if (!amount || amount < 1) { er.textContent = T[lang].errAmt; return; }
  er.textContent = "";
  var n = service === "tm" ? "+993 " + d.slice(0,2) + " " + d.slice(2) : idv, rub = fmt(calc(amount));
  pendingMsg = "Здравствуйте! Хочу пополнить Tmcell.\nНомер: " + n + "\nСумма: " + amount + " TMT\nК оплате: около " + rub + " ₽";
  pendingMsg = pendingMsg.replace("Tmcell", SV[service].name);
  $("sum").textContent = SV[service].name + " · " + n + " · " + amount + " TMT";
  $("sum2").textContent = T[lang].about + " " + rub + " ₽.";
  $("ok").href = "https://wa.me/" + WA_NUMBER + "?text=" + encodeURIComponent(pendingMsg) + "&z=1";
  $("form").classList.add("hidden");
  $("conf").classList.remove("hidden");
});
$("back").addEventListener("click", function(){ $("conf").classList.add("hidden"); $("form").classList.remove("hidden"); });
function confetti(){
  if (window.matchMedia("(prefers-reduced-motion: reduce)").matches) return;
  var host = $("done"), cols = ["#ffd23f","#0a55a8","#25d366","#ff6b6b","#ffffff"];
  for (var i = 0; i < 28; i++) {
    var s = document.createElement("span");
    s.className = "conf";
    s.style.left = Math.random() * 100 + "%";
    s.style.background = cols[i % cols.length];
    s.style.animationDelay = (Math.random() * 0.4) + "s";
    s.style.animationDuration = (1.4 + Math.random() * 1.2) + "s";
    host.appendChild(s);
    setTimeout(function(el){ el.remove(); }.bind(null, s), 3200);
  }
}
$("ok").addEventListener("click", function(){ $("conf").classList.add("hidden"); $("done").classList.remove("hidden"); confetti(); });

// Отдельный конвертор
var cr = $("cr"), ct = $("ct");
cr.addEventListener("input", function(){
  cr.value = cr.value.replace(/[^\d.,]/g, "");
  var v = num(cr.value); ct.value = v ? f2(v * TMT_PER_100_RUB / 100) : "";
});
ct.addEventListener("input", function(){
  ct.value = ct.value.replace(/[^\d.,]/g, "");
  var v = num(ct.value); cr.value = v ? f2(v * 100 / TMT_PER_100_RUB) : "";
});

apply();
</script>
